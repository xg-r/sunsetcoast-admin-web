# main에 올라오면: 타입 검사·lint → ARM(Graviton) 이미지 빌드 → GHCR에 latest, sha-xxxxxxx 태그로 올린다 → 서버 반영.
# 이어서 SSM으로 EC2에서 sunsetcoast-api 저장소의 deploy/deploy.sh web 을 실행해 화면만 반영한다 (저장소 변수가 있을 때만).
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # LayoutProps·PageProps 같은 라우트 타입은 Next가 .next/types에 만든다 (dev/build 없이 tsc만 돌리면 없음)
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src

  image:
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 서버 반영: GitHub OIDC로 AWS 역할을 받아 SSM Run Command로 EC2에서 deploy/deploy.sh를 실행한다.
  # EC2 인바운드 포트는 필요 없다 (SSM 에이전트가 AWS로 먼저 연결해 둔다). 설정은 sunsetcoast-api 저장소 deploy/README.md 7번.
  # 저장소 변수(Settings → Secrets and variables → Actions → Variables) AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID가 없으면 건너뛴다.
  deploy:
    needs: image
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: deploy.sh (SSM)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_ARGS: web
        run: |
          set -euo pipefail
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "github ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}" \
            --parameters "commands=[\"sudo -iu ubuntu /opt/sunsetcoast/deploy/deploy.sh ${DEPLOY_ARGS}\"],executionTimeout=[\"1200\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"
          # 최대 20분 기다린다
          for _ in $(seq 1 240); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status: $status"
          [ "$status" = Success ]
